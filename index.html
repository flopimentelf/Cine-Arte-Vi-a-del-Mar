<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualización de Datos</title>
  <style>
    /* Estilos globales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      overflow-x: hidden;
    }

    /* PANTALLA DE CARGA / ANIMACIÓN (INTRO) */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 1s ease, visibility 1s ease;
    }

    /* Canvas para renderizar la secuencia de animación */
    #animationCanvas {
      background-color: #000;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .skip-btn {
      margin-top: 20px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #ffffff55;
      color: #8b949e;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    .skip-btn:hover {
      background: #ffffff22;
      color: #fff;
    }

    /* CONTENIDO PRINCIPAL */
    #main-content {
      opacity: 0;
      transition: opacity 1.5s ease;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #58a6ff;
      margin-bottom: 10px;
    }

    .dashboard-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.2rem;
      color: #f0f6fc;
      margin-bottom: 15px;
    }

    .placeholder-chart {
      width: 100%;
      height: 200px;
      background: #21262d;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <!-- PANTALLA INTRODUCCIÓN CON ANIMACIÓN -->
  <div id="intro-screen">
    <canvas id="animationCanvas" width="800" height="450"></canvas>
    <button class="skip-btn" onclick="endIntro()">Saltar animación ➔</button>
  </div>

  <!-- CONTENIDO PRINCIPAL DE LA VISUALIZACIÓN DE DATOS -->
  <div id="main-content">
    <header>
      <h1 id="project-title">[ TÍTULO DE LA VISUALIZACIÓN ]</h1>
      <p>Análisis interactivo de datos de movilidad y seguridad vial</p>
    </header>

    <main class="dashboard-container">
      <div class="card">
        <h2>Indicador 1</h2>
        <div class="placeholder-chart">Espacio para gráfico (D3.js / Chart.js)</div>
      </div>
      <div class="card">
        <h2>Indicador 2</h2>
        <div class="placeholder-chart">Espacio para mapa / gráfico interactivo</div>
      </div>
      <div class="card">
        <h2>Indicador 3</h2>
        <div class="placeholder-chart">Espacio para tabla / métricas</div>
      </div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');

    // Lógica de la animación en canvas (Simulación de la secuencia)
    let frame = 0;
    const totalFrames = 180; // ~3 segundos a 60fps

    function drawStickman(x, y, posture) {
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 4;
      ctx.beginPath();
      
      // Cabeza
      ctx.arc(x, y - 40, 12, 0, Math.PI * 2);
      
      // Cuerpo
      ctx.moveTo(x, y - 28);
      ctx.lineTo(x, y);

      if (posture === 'walk') {
        // Brazos
        ctx.moveTo(x, y - 20);
        ctx.lineTo(x - 15 + Math.sin(frame * 0.2) * 10, y - 5);
        ctx.moveTo(x, y - 20);
        ctx.lineTo(x + 15 - Math.sin(frame * 0.2) * 10, y - 5);

        // Piernas
        ctx.moveTo(x, y);
        ctx.lineTo(x - 12 + Math.sin(frame * 0.2) * 15, y + 25);
        ctx.moveTo(x, y);
        ctx.lineTo(x + 12 - Math.sin(frame * 0.2) * 15, y + 25);
      } else if (posture === 'impact') {
        // Brazos arriba (reacción)
        ctx.moveTo(x, y - 20);
        ctx.lineTo(x - 20, y - 45);
        ctx.moveTo(x, y - 20);
        ctx.lineTo(x + 20, y - 45);

        // Piernas flexionadas
        ctx.moveTo(x, y);
        ctx.lineTo(x - 20, y + 15);
        ctx.moveTo(x, y);
        ctx.lineTo(x + 20, y + 15);
      }
      
      ctx.stroke();
    }

    function drawCar(x, y) {
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 4;
      ctx.beginPath();
      // Silueta simple de vehículo
      ctx.strokeRect(x, y - 30, 140, 30);
      ctx.strokeRect(x + 20, y - 55, 90, 25);
      // Ruedas
      ctx.arc(x + 30, y, 12, 0, Math.PI * 2);
      ctx.arc(x + 110, y, 12, 0, Math.PI * 2);
      ctx.stroke();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Línea de suelo
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 350);
      ctx.lineTo(800, 350);
      ctx.stroke();

      if (frame < 90) {
        // Fase 1: Monigote caminando hacia el centro
        let manX = 100 + (frame * 3);
        drawStickman(manX, 320, 'walk');
      } else if (frame < 140) {
        // Fase 2: Aparición del vehículo e impacto/reacción
        let carX = 800 - ((frame - 90) * 12);
        drawStickman(370, 320, 'impact');
        drawCar(carX, 350);
      } else {
        // Fase 3: Transición final
        drawStickman(370, 320, 'impact');
        drawCar(200, 350);
      }

      frame++;

      if (frame < totalFrames) {
        requestAnimationFrame(animate);
      } else {
        setTimeout(endIntro, 500); // Finaliza intro al terminar la secuencia
      }
    }

    // Iniciar secuencia cuando la página carga
    window.addEventListener('load', () => {
      animate();
    });

    // Función para ocultar el loader/video y mostrar la app de datos
    function endIntro() {
      const intro = document.getElementById('intro-screen');
      const main = document.getElementById('main-content');
      
      intro.style.opacity = '0';
      intro.style.visibility = 'hidden';
      
      setTimeout(() => {
        main.style.opacity = '1';
      }, 300);
    }
  </script>
</body>
</html>
