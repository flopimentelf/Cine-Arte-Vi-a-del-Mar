
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUÍ Y ALLÁ | Percepción peatonal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Manrope,sans-serif}
#opening{position:relative;width:100%;height:100svh;min-height:500px;overflow:hidden;background:#050505;color:#fff}
#openingCanvas{position:absolute;inset:0;width:100%;height:100%}
.opening-title{position:absolute;top:50%;left:50%;width:90%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 1.8s ease;pointer-events:none}
.opening-title.show{opacity:1}
.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:3px;margin-bottom:25px;color:#aaa}
.opening-title h1{font-size:clamp(48px,10vw,132px);font-weight:800;line-height:.9;letter-spacing:-.085em;margin:0}
.opening-title p{font:11px 'DM Mono',monospace;letter-spacing:2px;line-height:2;color:#aaa;margin:30px auto 0}
.opening-bottom{position:absolute;bottom:30px;left:5vw;right:5vw;display:flex;justify-content:space-between;font:9px 'DM Mono',monospace;letter-spacing:1.5px;color:#888;opacity:0;transition:opacity 1s ease}
.opening-bottom.show{opacity:1}
@media(max-width:650px){
.opening-title{width:94%}
.opening-title h1{font-size:16vw}
.opening-bottom{left:20px;right:20px;font-size:8px}
}
</style>
</head>
<body>

<section id="opening">
<canvas id="openingCanvas"></canvas>
<div class="opening-title" id="openingTitle">
<div class="eyebrow">CIUDADES PUERTO / CHILE × ARGENTINA</div>
<h1>PERCEPCIÓN<br>PEATONAL</h1>
<p>VALPARAÍSO · BUENOS AIRES</p>
</div>
<div class="opening-bottom" id="openingBottom">
<span>AQUÍ / CHILE</span>
<span>ALLÁ / ARGENTINA</span>
</div>
</section>

<script>
const canvas=document.getElementById('openingCanvas');
const ctx=canvas.getContext('2d');

let W=0,H=0,DPR=1;
const start=performance.now();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>{
t=clamp(t,0,1);
return t*t*(3-2*t);
};
const smoother=t=>{
t=clamp(t,0,1);
return t*t*t*(t*(6*t-15)+10);
};

function resize(){
DPR=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;
H=window.innerHeight;
canvas.width=W*DPR;
canvas.height=H*DPR;
canvas.style.width=W+'px';
canvas.style.height=H+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
resize();

function stroke(x1,y1,x2,y2,width){
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.lineWidth=width;
ctx.lineCap='round';
ctx.lineJoin='round';
ctx.strokeStyle='#f5f5f2';
ctx.stroke();
}

function drawPerson(x,ground,phase,lean,scale,pose=0){
ctx.save();
ctx.translate(x,ground);
ctx.rotate(lean);
ctx.scale(scale,scale);

const swing=Math.sin(phase);
const legA=swing*17;
const legB=-swing*17;
const armA=-swing*12;
const armB=swing*12;

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.arc(0,-105,12,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.roundRect(-11,-83,22,46,10);
ctx.fill();

if(pose<.25){
stroke(-6,-40,-12+legA*.45,-21,9);
stroke(-12+legA*.45,-21,-17+legA,-2,8);
stroke(6,-40,12+legB*.45,-21,9);
stroke(12+legB*.45,-21,17+legB,-2,8);
stroke(-8,-77,-15+armA*.4,-59,8);
stroke(-15+armA*.4,-59,-17+armA,-47,7);
stroke(8,-77,15+armB*.4,-59,8);
stroke(15+armB*.4,-59,17+armB,-47,7);
}else{
const p=clamp(pose,0,1);
stroke(-6,-40,-15-p*7,-24+p*7,9);
stroke(-15-p*7,-24+p*7,-20-p*10,-4+p*5,8);
stroke(6,-40,15+p*9,-24+p*7,9);
stroke(15+p*9,-24+p*7,22+p*10,-5+p*5,8);
stroke(-8,-77,-23-p*8,-64-p*5,8);
stroke(-23-p*8,-64-p*5,-31-p*8,-52-p*7,7);
stroke(8,-77,23+p*8,-64-p*5,8);
stroke(23+p*8,-64-p*5,31+p*8,-52-p*7,7);
}
ctx.restore();
}

function drawStone(x,y,size,rotation){
ctx.save();
ctx.translate(x,y);
ctx.rotate(rotation);
ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.moveTo(-size,-2);
ctx.lineTo(-size*.55,-size*.7);
ctx.lineTo(size*.25,-size);
ctx.lineTo(size,-size*.3);
ctx.lineTo(size*.65,size*.35);
ctx.lineTo(-size*.45,size*.4);
ctx.closePath();
ctx.fill();
ctx.restore();
}

function drawCar(x,y,scale){
ctx.save();
ctx.translate(x,y);
ctx.scale(scale,scale);
ctx.fillStyle='#f5f5f2';

ctx.beginPath();
ctx.moveTo(-78,-16);
ctx.quadraticCurveTo(-74,-32,-50,-35);
ctx.lineTo(-25,-55);
ctx.quadraticCurveTo(-17,-62,0,-62);
ctx.lineTo(35,-59);
ctx.quadraticCurveTo(51,-57,60,-35);
ctx.lineTo(78,-27);
ctx.quadraticCurveTo(86,-24,86,-13);
ctx.lineTo(86,-6);
ctx.quadraticCurveTo(86,0,76,0);
ctx.lineTo(-75,0);
ctx.quadraticCurveTo(-86,0,-86,-9);
ctx.lineTo(-86,-17);
ctx.closePath();
ctx.fill();

ctx.fillStyle='#050505';
ctx.beginPath();
ctx.moveTo(-20,-54);
ctx.lineTo(-2,-54);
ctx.lineTo(-1,-37);
ctx.lineTo(-44,-37);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.moveTo(7,-54);
ctx.lineTo(32,-52);
ctx.quadraticCurveTo(45,-50,52,-37);
ctx.lineTo(7,-37);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.arc(-50,0,13,0,Math.PI*2);
ctx.arc(50,0,13,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.arc(-50,0,5,0,Math.PI*2);
ctx.arc(50,0,5,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function drawFloor(ground,holeX,holeWidth,holeHeight){
ctx.fillStyle='#f5f5f2';
ctx.fillRect(0,ground,W,H-ground);

ctx.fillStyle='#050505';
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth,holeHeight,0,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle='#f5f5f2';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth,holeHeight,Math.PI,0);
ctx.stroke();
}

function drawOpening(now){
const t=(now-start)/1000;
ctx.clearRect(0,0,W,H);
ctx.fillStyle='#050505';
ctx.fillRect(0,0,W,H);

const ground=H*.74;
const scale=Math.min(1.85,H/450);

const personStart=W*.24;
const stoneX=W*.47;
const holeX=W*.69;
const holeWidth=Math.min(90,W*.13);
const holeHeight=27;

const stumbleStart=2.0;
const stumbleEnd=2.55;
const carStart=3.3;
const carEnd=4.1;
const recoilStart=3.85;
const recoveryStart=4.5;
const fallStart=6.1;
const fallEnd=7.35;

const approach=ease(t/5.7);
const stumble=ease((t-stumbleStart)/.2)*(1-ease((t-2.85)/.35));
const recoil=ease((t-recoilStart)/.18)*(1-ease((t-4.35)/.3));
const resume=ease((t-recoveryStart)/.5);

let personX=personStart+(holeX-personStart-12)*approach;
let personLean=stumble*.48-recoil*.3;
let personPose=Math.max(stumble,recoil);
let personY=ground;

if(t>stumbleEnd){
const stopped=ease((t-stumbleEnd)/.25);
const resumed=ease((t-recoveryStart)/.5);
personX=personStart+(holeX-personStart-12)*(
ease(stumbleEnd/5.7)+(1-ease(stumbleEnd/5.7))*0
);
personX=stoneX+28+Math.max(0,t-recoveryStart)*((holeX-stoneX-35)/1.65);
if(t<recoveryStart)personX=stoneX+28;
personX=clamp(personX,personStart,holeX-12);
}

if(t>=fallStart){
const fall=smoother((t-fallStart)/(fallEnd-fallStart));
personX=holeX;
personY=ground+fall*300;
personLean=fall*.22;
personPose=fall;
}

const carProgress=smoother((t-carStart)/(carEnd-carStart));
const carScale=Math.max(1.25,Math.min(1.65,H/500));
const carX=W+230-carProgress*(W+480);

const stoneImpact=ease((t-stumbleStart)/.12);
const stoneAlpha=1-stoneImpact;

ctx.save();
ctx.globalAlpha=stoneAlpha;
if(t<stumbleStart+.16){
drawStone(
stoneX,
ground-2-(stumble*25),
15,
stumble*.55
);
}
ctx.restore();

if(t>=fallStart){
ctx.save();
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth,holeHeight,0,0,Math.PI*2);
ctx.clip();
drawPerson(personX,personY,t*5,personLean,scale,personPose);
ctx.restore();
}else{
drawPerson(personX,personY,t*8,personLean,scale,personPose);
}

if(t>carStart&&t<carEnd+.08){
drawCar(carX,ground-3,carScale);
}

if(t>3.75&&t<4.35){
const flash=(1-ease((t-3.75)/.6))*.2;
ctx.fillStyle=`rgba(255,255,255,${flash})`;
ctx.fillRect(0,0,W,H);
}

drawFloor(ground,holeX,holeWidth,holeHeight);

if(t>4.8&&t<5.5){
const impact=1-ease((t-4.8)/.7);
ctx.save();
ctx.globalAlpha=impact*.55;
ctx.strokeStyle='#f5f5f2';
ctx.lineWidth=2;
for(let i=0;i<4;i++){
const spread=holeWidth*(.8+i*.3);
ctx.beginPath();
ctx.moveTo(holeX-spread,ground-5-i*4);
ctx.lineTo(holeX-spread-9,ground-12-i*4);
ctx.moveTo(holeX+spread,ground-5-i*4);
ctx.lineTo(holeX+spread+9,ground-12-i*4);
ctx.stroke();
}
ctx.restore();
}

if(t>=fallStart){
const depth=ease((t-6.35)/.75);
ctx.save();
ctx.globalAlpha=depth*.65;
ctx.fillStyle='#050505';
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth,holeHeight,0,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

const fade=ease((t-7.55)/.9);
if(fade>0){
ctx.fillStyle=`rgba(5,5,5,${fade})`;
ctx.fillRect(0,0,W,H);
}

if(t>8.45){
document.getElementById('openingTitle').classList.add('show');
document.getElementById('openingBottom').classList.add('show');
}

requestAnimationFrame(drawOpening);
}

requestAnimationFrame(drawOpening);
</script>
</body>
</html>
