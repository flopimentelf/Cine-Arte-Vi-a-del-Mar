<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUÍ Y ALLÁ | Percepción peatonal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap');

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
font-family:Manrope,sans-serif;
}

#opening{
position:relative;
width:100%;
height:100svh;
min-height:500px;
overflow:hidden;
background:#050505;
color:white;
}

#openingCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
}

.opening-title{
position:absolute;
top:50%;
left:50%;
width:90%;
transform:translate(-50%,-50%);
text-align:center;
opacity:0;
transition:opacity 1.8s ease;
pointer-events:none;
}

.opening-title.show{opacity:1}

.eyebrow{
font:10px 'DM Mono',monospace;
letter-spacing:3px;
margin-bottom:25px;
color:#aaa;
}

.opening-title h1{
font-size:clamp(48px,10vw,132px);
font-weight:800;
line-height:.9;
letter-spacing:-.085em;
margin:0;
}

.opening-title p{
font:11px 'DM Mono',monospace;
letter-spacing:2px;
line-height:2;
color:#aaa;
margin:30px auto 0;
}

.opening-bottom{
position:absolute;
bottom:30px;
left:5vw;
right:5vw;
display:flex;
justify-content:space-between;
font:9px 'DM Mono',monospace;
letter-spacing:1.5px;
color:#888;
opacity:0;
transition:opacity 1s ease;
}

.opening-bottom.show{opacity:1}

@media(max-width:650px){
.opening-title{width:94%}
.opening-title h1{font-size:16vw}
.opening-bottom{
left:20px;
right:20px;
font-size:8px;
}
}
</style>
</head>

<body>

<section id="opening">
<canvas id="openingCanvas"></canvas>

<div class="opening-title" id="openingTitle">
<div class="eyebrow">CIUDADES PUERTO / CHILE × ARGENTINA</div>
<h1>PERCEPCIÓN<br>PEATONAL</h1>
<p>VALPARAÍSO · BUENOS AIRES</p>
</div>

<div class="opening-bottom" id="openingBottom">
<span>AQUÍ / CHILE</span>
<span>ALLÁ / ARGENTINA</span>
</div>
</section>

<script>
const canvas=document.getElementById('openingCanvas');
const ctx=canvas.getContext('2d');

let W=0;
let H=0;
let DPR=1;
let start=performance.now();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{
t=clamp(t,0,1);
return t*t*(3-2*t);
};
const smoother=t=>{
t=clamp(t,0,1);
return t*t*t*(t*(6*t-15)+10);
};

function resize(){
DPR=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;
H=window.innerHeight;

canvas.width=W*DPR;
canvas.height=H*DPR;
canvas.style.width=W+'px';
canvas.style.height=H+'px';

ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener('resize',resize);
resize();

function line(x1,y1,x2,y2,width,color='#f5f5f2'){
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.lineWidth=width;
ctx.lineCap='round';
ctx.lineJoin='round';
ctx.strokeStyle=color;
ctx.stroke();
}

function drawPerson(x,y,phase,lean,scale,fallPose=0){
ctx.save();
ctx.translate(x,y);
ctx.rotate(lean);
ctx.scale(scale,scale);

const white='#f5f5f2';
const walk=Math.sin(phase);
const legA=walk*17;
const legB=-walk*17;
const armA=-walk*11;
const armB=walk*11;

const headY=-108;
const torsoTop=-83;
const torsoBottom=-39;

ctx.fillStyle=white;
ctx.beginPath();
ctx.arc(0,headY,12,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.roundRect(-11,torsoTop,22,46,10);
ctx.fill();

if(fallPose<0.3){
line(-6,torsoBottom,-12+legA*.45,-20,9,white);
line(-12+legA*.45,-20,-17+legA,-2,8,white);
line(6,torsoBottom,12+legB*.45,-20,9,white);
line(12+legB*.45,-20,17+legB,-2,8,white);

line(-17+legA,-2,-9+legA,-2,7,white);
line(17+legB,-2,25+legB,-2,7,white);

line(-8,-77,-15+armA*.4,-59,8,white);
line(-15+armA*.4,-59,-17+armA,-47,7,white);
line(8,-77,15+armB*.4,-59,8,white);
line(15+armB*.4,-59,17+armB,-47,7,white);
}else{
const p=clamp(fallPose,0,1);

line(-6,torsoBottom,-15-p*8,-24+p*8,9,white);
line(-15-p*8,-24+p*8,-20-p*12,-5+p*5,8,white);

line(6,torsoBottom,15+p*10,-25+p*8,9,white);
line(15+p*10,-25+p*8,22+p*12,-7+p*5,8,white);

line(-8,-77,-22-p*8,-63-p*5,8,white);
line(-22-p*8,-63-p*5,-30-p*8,-51-p*7,7,white);

line(8,-77,22+p*8,-63-p*5,8,white);
line(22+p*8,-63-p*5,30+p*8,-51-p*7,7,white);
}

ctx.restore();
}

function drawCar(x,y,scale){
ctx.save();
ctx.translate(x,y);
ctx.scale(scale,scale);

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.moveTo(-76,-17);
ctx.quadraticCurveTo(-70,-34,-47,-36);
ctx.lineTo(-24,-55);
ctx.quadraticCurveTo(-16,-62,0,-62);
ctx.lineTo(35,-59);
ctx.quadraticCurveTo(51,-57,59,-35);
ctx.lineTo(77,-27);
ctx.quadraticCurveTo(85,-24,85,-13);
ctx.lineTo(85,-6);
ctx.quadraticCurveTo(85,0,76,0);
ctx.lineTo(-74,0);
ctx.quadraticCurveTo(-84,0,-84,-9);
ctx.lineTo(-84,-17);
ctx.closePath();
ctx.fill();

ctx.fillStyle='#050505';
ctx.beginPath();
ctx.moveTo(-19,-54);
ctx.lineTo(-1,-54);
ctx.lineTo(0,-37);
ctx.lineTo(-43,-37);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.moveTo(7,-54);
ctx.lineTo(32,-52);
ctx.quadraticCurveTo(44,-50,51,-37);
ctx.lineTo(7,-37);
ctx.closePath();
ctx.fill();

ctx.fillStyle='#050505';
ctx.beginPath();
ctx.arc(-49,0,13,0,Math.PI*2);
ctx.arc(50,0,13,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.arc(-49,0,5,0,Math.PI*2);
ctx.arc(50,0,5,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function drawStone(x,y,size){
ctx.save();
ctx.translate(x,y);
ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.moveTo(-size,-2);
ctx.lineTo(-size*.45,-size*.75);
ctx.lineTo(size*.45,-size);
ctx.lineTo(size,-size*.25);
ctx.lineTo(size*.7,size*.25);
ctx.lineTo(-size*.55,size*.35);
ctx.closePath();
ctx.fill();
ctx.restore();
}

function drawGroundWithHole(ground,holeX,holeWidth,holeHeight,open){
ctx.save();

const w=holeWidth*open;
const h=holeHeight*open;

ctx.fillStyle='#f5f5f2';
ctx.beginPath();
ctx.rect(0,ground,W,H-ground);

if(open>0.001){
ctx.moveTo(holeX-w,ground);
ctx.ellipse(holeX,ground,w,h,0,Math.PI,Math.PI*2);
ctx.lineTo(holeX+w,ground);
ctx.ellipse(holeX,ground,w,h,0,0,Math.PI);
}

ctx.fill('evenodd');
ctx.restore();

if(open>0.001){
ctx.fillStyle='#050505';
ctx.beginPath();
ctx.ellipse(holeX,ground,w,h,0,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle='#f5f5f2';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.ellipse(holeX,ground,w,h,0,Math.PI,Math.PI*2);
ctx.stroke();
}
}

function drawOpening(now){
const t=(now-start)/1000;

ctx.clearRect(0,0,W,H);
ctx.fillStyle='#050505';
ctx.fillRect(0,0,W,H);

const ground=H*.74;
const scale=Math.min(1,H/700);
const personStart=W*.40;
const holeX=personStart-90;
const holeWidth=Math.min(105,W*.17);
const holeHeight=22;

const walkProgress=smooth(t/2.4);
const stumble=smooth((t-1.95)/.45);
const recover=smooth((t-2.45)/.42);
const carProgress=smooth((t-3.25)/.72);
const recoil=smooth((t-3.85)/.2)*(1-smooth((t-4.42)/.3));
const holeOpen=smooth((t-4.65)/.55);
const fallStart=5.15;
const fallProgress=smoother((t-fallStart)/1.65);
const fade=smooth((t-7.0)/.85);

const travel=(W*.07)*walkProgress;
const personWalkX=personStart+travel;
const floorTravel=travel*.65;
const stoneX=personStart-15+floorTravel;

const stumbleLean=stumble*(1-recover)*.62;
const recoilLean=-recoil*.3;

let personX=personWalkX;
let personY=ground;
let personLean=stumbleLean+recoilLean;
let fallPose=0;

if(t>=fallStart){
const fall=smoother((t-fallStart)/1.65);
personX=holeX;
personY=ground+fall*205;
personLean=fall*1.15;
fallPose=fall;
}

const carScale=Math.max(.78,Math.min(1.05,H/750));

if(t<fallStart){
ctx.save();
ctx.beginPath();
ctx.rect(0,0,W,H);
ctx.clip();

if(t<4.65){
drawStone(
stoneX,
ground-3-(stumble*(1-recover)*25),
10+stumble*3
);
}

ctx.restore();
}

if(t<fallStart){
drawPerson(
personX,
personY,
t*8,
personLean,
scale,
Math.max(stumble,recoil)
);
}

if(t>=fallStart && t<7.0){
drawPerson(
personX,
personY,
t*8,
personLean,
scale,
fallPose
);
}

if(t>3.25 && t<4.65){
const carX=W+190-carProgress*(W+420);
const carY=ground-3;
drawCar(carX,carY,carScale);
}

if(t>3.8 && t<4.45){
const flash=1-smooth((t-3.8)/.65);
ctx.save();
ctx.globalAlpha=flash*.28;
ctx.fillStyle='#fff';
ctx.fillRect(0,0,W,H);
ctx.restore();
}

if(t>=fallStart){
drawGroundWithHole(
ground,
holeX,
holeWidth,
holeHeight,
holeOpen
);
}else{
ctx.fillStyle='#f5f5f2';
ctx.fillRect(0,ground,W,H-ground);
}

if(t>4.65 && t<5.3){
const impact=1-smooth((t-4.65)/.65);
ctx.save();
ctx.globalAlpha=impact*.7;
ctx.strokeStyle='#f5f5f2';
ctx.lineWidth=2;

for(let i=0;i<4;i++){
const spread=holeWidth*(.5+i*.3);
ctx.beginPath();
ctx.moveTo(holeX-spread,ground-5-i*4);
ctx.lineTo(holeX-spread-10,ground-12-i*4);
ctx.moveTo(holeX+spread,ground-5-i*4);
ctx.lineTo(holeX+spread+10,ground-12-i*4);
ctx.stroke();
}
ctx.restore();
}

if(t>=fallStart){
const depth=smooth((t-5.55)/.95);
ctx.save();
ctx.globalAlpha=depth*.9;
ctx.fillStyle='#050505';
ctx.beginPath();
ctx.ellipse(holeX,ground,holeWidth*holeOpen,holeHeight*holeOpen,0,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

if(fade>0){
ctx.fillStyle=`rgba(5,5,5,${fade})`;
ctx.fillRect(0,0,W,H);
}

if(t>7.8){
document.getElementById('openingTitle').classList.add('show');
document.getElementById('openingBottom').classList.add('show');
}

requestAnimationFrame(drawOpening);
}

requestAnimationFrame(drawOpening);
</script>

</body>
</html>
